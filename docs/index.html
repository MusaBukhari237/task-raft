<title>A local task list | Task Raft</title>
<meta name="description" content="Add, edit, finish, and filter tasks. Your list stays in this browser between visits.">
<link rel="canonical" href="https://musabukhari237.github.io/task-raft/">
<meta property="og:type" content="website">
<meta property="og:title" content="A local task list | Task Raft">
<meta property="og:description" content="Add, edit, finish, and filter tasks. Your list stays in this browser between visits.">
<meta property="og:url" content="https://musabukhari237.github.io/task-raft/">
<meta property="og:image" content="https://musabukhari237.github.io/task-raft/preview.png">
<meta property="og:image:alt" content="Task Raft showing the tool with an example result">

<link rel="stylesheet" href="app.css">

<body>
<header><a class="brand" href="./"><img src="logo.svg" alt="">Task Raft</a><a class="repo" href="https://github.com/MusaBukhari237/task-raft">Source on GitHub</a></header>
<main>
<section class="hero"><h1>A local task list</h1><p>Add, edit, finish, and filter tasks. Your list stays in this browser between visits.</p></section>
<div class="workspace">
<section class="panel input" aria-labelledby="settings"><h2 id="settings">Add and filter</h2>
<div class="fields"><label class="wide">New task<input id="title" maxlength="160" placeholder="Write the first draft"></label><label>Show<select id="filter"><option value="all">All tasks</option><option value="open">Open</option><option value="done">Completed</option></select></label></div><div class="actions"><button type="button" id="run">Add task</button><button type="button" class="quiet" id="example">Add example tasks</button></div><p class="note">Task data is stored for this site in your browser. Clearing site data clears the list.</p>
</section>
<section class="panel output" aria-labelledby="output"><h2 id="output">Tasks</h2><div class="result" id="result" aria-live="polite">Loading tasks…</div></section>
</div>
</main>
<footer>Open-source browser tool · <a href="https://github.com/MusaBukhari237/task-raft/blob/HEAD/LICENSE">MIT license</a></footer>
</body>
</html>
